<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Brew Cafe</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="menu">
        <main>
            <h1>MOUNTAIN BREW CAFE</h1>
            <p class="established">Est. 2026</p>

            <hr>

            <section>
                <h2>Coffee</h2>
                <article class="item">
                    <p class="flavor">Espresso</p><p class="price">2.50</p>
                </article>
                <article class="item">
                    <p class="flavor">Cappuccino</p><p class="price">3.50</p>
                </article>
                <article class="item">
                    <p class="flavor">Latte</p><p class="price">4.00</p>
                </article>
                <article class="item">
                    <p class="flavor">Americano</p><p class="price">3.00</p>
                </article>
                <article class="item">
                    <p class="flavor">Cold Brew</p><p class="price">4.50</p>
                </article>
            </section>

            <section>
                <h2>Desserts</h2>
                <article class="item">
                    <p class="dessert">Chocolate Cake</p><p class="price">3.50</p>
                </article>
                <article class="item">
                    <p class="dessert">Brownie</p><p class="price">2.50</p>
                </article>
                <article class="item">
                    <p class="dessert">Blueberry Muffin</p><p class="price">2.75</p>
                </article>
                <article class="item">
                    <p class="dessert">Croissant</p><p class="price">2.00</p>
                </article>
            </section>
        </main>

        <hr class="bottom-line">

        <footer>
            <address>
                <p class="address">Delhi, India</p>
            </address>
        </footer>
    </div>
</body>
</html>
