<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="StylizedToDoList.css">
</head>

<body>
    <header>
         <h1 class="heading">My To-Do List</h1>
    </header>
    <div class="card">
    <ul class="todo-list">
        
  <li>
  <input type="checkbox" id="task1" name="task1">
  <label for="task1">Complete today's priority task</label>
  <ul class="sub-item">
    <li>
      <a class="sub-item-link" href="#">View details</a>
    </li>
  </ul>
</li>

<li>
  <input type="checkbox" id="task2" name="task2">
  <label for="task2">Exercise for 30 minutes</label>
  <ul class="sub-item">
    <li>
      <a class="sub-item-link" href="#">Workout plan</a>
    </li>
  </ul>
</li>

<li>
  <input type="checkbox" id="task3" name="task3">
  <label for="task3">Read for 20 minutes</label>
  <ul class="sub-item">
    <li>
      <a class="sub-item-link" href="#">Reading list</a>
    </li>
  </ul>
</li>

<li>
  <input type="checkbox" id="task4" name="task4">
  <label for="task4">Review upcoming deadlines</label>
  <ul class="sub-item">
    <li>
      <a class="sub-item-link" href="#">Schedule</a>
    </li>
  </ul>
</li>
  </ul>
  </div>

</body>

</html>
