<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="BlogPost.css">
</head>
<body>
  <div class="blog-post-card">
    <img src="BlogPost.jpg" 
         alt="Cover photo for blog post" 
         class="post-img">
    <div class="post-content">
      <h2 class="post-title">My First Blog Post</h2>
      <p class="post-excerpt">This is a short summary of my blog post, giving readers a quick idea of what it’s about.</p>
      <a class="read-more" href="#">Read More</a>
    </div>
  </div>
</body>
</html>
