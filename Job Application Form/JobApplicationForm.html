<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <link rel="stylesheet" href="JobApplicationForm.css">
</head>
<body>
  <div class="container">
    <h1>Job Application Form</h1>
    <form>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="position">Position:</label>
      <select id="position" name="position" required>
        <option value="developer">Developer</option>
        <option value="designer">Designer</option>
        <option value="manager">Manager</option>
      </select>

      <fieldset>
        <legend>Availability</legend>
        <input type="radio" id="full-time" name="availability" value="full-time" required>
        <label for="full-time">Full-Time</label>

        <input type="radio" id="part-time" name="availability" value="part-time">
        <label for="part-time">Part-Time</label>
      </fieldset>

      <label for="message">Why do you want this job?</label>
      <textarea id="message" name="message" placeholder="Tell us why you'd like this role" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
